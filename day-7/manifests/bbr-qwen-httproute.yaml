# BBR HTTPRoute for unified /v1/chat/completions routing to Qwen.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bbr-qwen3-4b-instruct
  namespace: llm
  labels:
    app.kubernetes.io/part-of: models-as-a-service
    maas.opendatahub.io/day7: lightspeed-maas
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-default-gateway
      namespace: openshift-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - type: Exact
              name: X-Gateway-Model-Name
              value: qwen3-4b-instruct
      backendRefs:
        - group: ""
          kind: Service
          name: qwen3-4b-instruct-kserve-workload-svc
          port: 8000
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
