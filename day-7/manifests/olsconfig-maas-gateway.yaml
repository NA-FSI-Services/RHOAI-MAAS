# OLSConfig — route OpenShift Lightspeed to the MaaS gateway (OpenAI-compatible).
# URL is set at install time by run-day7-install.sh (inline OLSConfig apply).
#
# contextWindowSize / maxTokensForResponse must fit the serving --max-model-len
# (Lightspeed ships 24 MCP tools + system prompt; 8k context overflows easily).
apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  labels:
    maas.opendatahub.io/day7: lightspeed-maas
spec:
  llm:
    providers:
      - name: maas-gateway
        type: openai
        url: https://maas.example.com/v1
        credentialsSecretRef:
          name: maas-gateway-api-key
        models:
          - name: llama-3-1-8b-instruct
            contextWindowSize: 32768
            parameters:
              toolBudgetRatio: 0.35
              maxTokensForResponse: 1024
  ols:
    defaultProvider: maas-gateway
    defaultModel: llama-3-1-8b-instruct
