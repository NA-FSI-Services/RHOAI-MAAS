# Extend MaaSAuthPolicies so gateway Authorino enforces access to the external model.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: simulator-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
    - name: codellama-7b-instruct
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: granite-tiny-gpu-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: granite-4-tiny-gpu
      namespace: llm
    - name: codellama-7b-instruct
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated
