apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: llama-31-70b-cpu-free
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Workshop Llama 3.1 70B Free Tier"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: llama-31-70b-cpu
      namespace: llm
      tokenRateLimits:
        - limit: 500
          window: 1m
  # Unique priority required on RHOAI 3.5-ea (SharedPriority)
  priority: 30
