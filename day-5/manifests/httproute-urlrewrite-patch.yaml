# Supplementary patch for controller-generated ExternalModel HTTPRoute.
# Strips /llm/<model> prefix and normalizes unified BBR path for LiteLLM.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codellama-7b-instruct
  namespace: llm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-default-gateway
      namespace: openshift-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm/codellama-7b-instruct
      backendRefs:
        - group: ""
          kind: Service
          name: codellama-7b-instruct
          port: 443
          weight: 1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: maas-rhdp.apps.maas.redhatworkshops.io
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      timeouts:
        request: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - type: Exact
              name: X-Gateway-Model-Name
              value: codellama-7b-instruct
      backendRefs:
        - group: ""
          kind: Service
          name: codellama-7b-instruct
          port: 443
          weight: 1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: maas-rhdp.apps.maas.redhatworkshops.io
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      timeouts:
        request: 300s
