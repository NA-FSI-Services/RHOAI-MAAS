# Path rewrite for ExternalModel HTTPRoute (LiteLLM expects /v1/... not /llm/<model>/v1/...)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-31-70b-cpu
  namespace: llm
  labels:
    maas.opendatahub.io/day5: litellm-external
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-default-gateway
      namespace: openshift-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llm/llama-31-70b-cpu
      backendRefs:
        - group: ""
          kind: Service
          name: llama-31-70b-cpu
          port: 443
          weight: 1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: maas-rhdp.apps.maas.redhatworkshops.io
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      timeouts:
        request: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - type: Exact
              name: X-Gateway-Model-Name
              value: llama-31-70b-cpu
      backendRefs:
        - group: ""
          kind: Service
          name: llama-31-70b-cpu
          port: 443
          weight: 1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: maas-rhdp.apps.maas.redhatworkshops.io
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/chat/completions
      timeouts:
        request: 300s
