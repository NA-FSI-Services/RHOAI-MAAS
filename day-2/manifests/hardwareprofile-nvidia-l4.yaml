# NVIDIA L4 GPU hardware profile for MaaS model serving on GPU workers.
# Targets nodes labeled nvidia.com/gpu.product=NVIDIA-L4 (g6.4xlarge in this demo)
# and tolerates the nvidia.com/gpu=present:NoSchedule taint applied by the GPU Operator.
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: nvidia-l4-gpu
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/display-name: "NVIDIA L4 GPU"
    opendatahub.io/description: "Single NVIDIA L4 GPU for LLMInferenceService workloads (g6.4xlarge)."
    opendatahub.io/disabled: "false"
    opendatahub.io/dashboard-feature-visibility: '["model-serving"]'
  labels:
    maas.opendatahub.io/day2: gpu-hardware-profile
spec:
  identifiers:
    - identifier: cpu
      displayName: CPU
      defaultCount: 4
      minCount: 2
      maxCount: 8
      resourceType: CPU
    - identifier: memory
      displayName: Memory
      defaultCount: 16Gi
      minCount: 8Gi
      maxCount: 32Gi
      resourceType: Memory
    - identifier: nvidia.com/gpu
      displayName: NVIDIA L4 GPU
      defaultCount: 1
      minCount: 1
      maxCount: 1
      resourceType: Accelerator
  scheduling:
    type: Node
    node:
      nodeSelector:
        nvidia.com/gpu.present: "true"
        nvidia.com/gpu.product: NVIDIA-L4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
