# Demo personas for observability showback — distinct subscriptions, rate limits, and cost metadata.
# API keys are minted by run-day6-install.sh (not stored in git).
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo-retail-analyst
  namespace: models-as-a-service
  labels:
    maas.opendatahub.io/day6: observability-demo
  annotations:
    openshift.io/display-name: "Demo — Retail Analyst Team"
    openshift.io/description: "Low-volume simulator + external model usage (Retail LOB)"
spec:
  priority: 11
  owner:
    groups:
      - name: maas-demo-retail-analyst
  tokenMetadata:
    organizationId: org-retail
    costCenter: CC-RETAIL-1001
    labels:
      team: retail-analytics
      demo_persona: retail-analyst
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
      tokenRateLimits:
        - limit: 3000
          window: 1m
    - name: codellama-7b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 3000
          window: 1m
---
