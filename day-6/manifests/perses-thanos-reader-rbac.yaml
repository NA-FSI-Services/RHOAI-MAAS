# RBAC for Perses to query Kuadrant/Limitador metrics via platform Thanos Querier.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-perses-thanos-reader
  namespace: redhat-ods-applications
  labels:
    maas.opendatahub.io/day6: observability-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-perses-thanos-reader
  labels:
    maas.opendatahub.io/day6: observability-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: maas-perses-thanos-reader
    namespace: redhat-ods-applications
