# Authorize client-test groups to their subscription models only.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: lob-retail-access
  namespace: models-as-a-service
  labels:
    maas.opendatahub.io/client-test: "true"
spec:
  subjects:
    groups:
      - name: maas-lob-retail
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
