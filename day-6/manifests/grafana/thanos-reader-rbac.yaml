# Read platform Thanos (Kuadrant/Limitador authorized_hits metrics).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-grafana-thanos-reader
  namespace: maas-grafana
  labels:
    maas.opendatahub.io/day6: observability-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-grafana-thanos-reader
  labels:
    maas.opendatahub.io/day6: observability-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: maas-grafana-thanos-reader
    namespace: maas-grafana
