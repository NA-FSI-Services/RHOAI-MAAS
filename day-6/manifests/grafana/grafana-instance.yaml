apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: maas-grafana
  namespace: maas-grafana
  labels:
    app.kubernetes.io/part-of: maas-observability
    dashboards: grafana
    maas.opendatahub.io/day6: observability-demo
spec:
  config:
    auth:
      disable_login_form: "false"
    log:
      mode: console
    security:
      admin_user: admin
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: maas-grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
  route:
    spec:
      ingress:
        termination: edge
