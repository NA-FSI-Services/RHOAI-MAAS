# Client-test subscriptions — distinct model access, rate limits, and cost metadata.
# Priorities must be unique cluster-wide (RHOAI 3.5 SharedPriority).
# Catch-all *-free system:authenticated subscriptions must be restricted separately.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: lob-retail
  namespace: models-as-a-service
  labels:
    maas.opendatahub.io/client-test: "true"
  annotations:
    openshift.io/display-name: "Retail LOB — Llama 3.1 8B (limited)"
    openshift.io/description: "Retail analysts: local Llama only, low token budget"
spec:
  priority: 40
  owner:
    groups:
      - name: maas-lob-retail
  tokenMetadata:
    organizationId: org-retail
    costCenter: CC-RETAIL-1001
    labels:
      team: retail-analytics
      lob: retail
  modelRefs:
    - name: llama-3-1-8b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 100
          window: 1m
---
