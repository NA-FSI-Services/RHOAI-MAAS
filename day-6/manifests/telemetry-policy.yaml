# Gateway telemetry for showback labels on Limitador authorized_hits.
#
# Nested auth.identity.subscription_info.* paths stalled Limitador counters on
# RHOAI 3.5-ea / this Authorino build. Keep labels to flat string identity fields
# plus responseBodyJSON("/model").
apiVersion: extensions.kuadrant.io/v1alpha1
kind: TelemetryPolicy
metadata:
  name: maas-telemetry
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: maas-observability
    maas.opendatahub.io/day6: observability-demo
spec:
  metrics:
    default:
      labels:
        model: responseBodyJSON("/model")
        user: auth.identity.userid
        subscription: auth.identity.selected_subscription
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
